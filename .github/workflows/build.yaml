name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4
        with:
          texlive_version: '2026'
          packages: |
            scheme-medium
            latexmk
            biber
            tabularray
            makecell
            collection-latexextra
            collection-fontsrecommended
            collection-langcyrillic
            cm-super
            biblatex-gost

      - name: Build Book I
        run: latexmk -norc -r latexmkrc -pdf -interaction=nonstopmode -halt-on-error dissertation.tex

      - name: Show LaTeX log on failure
        if: failure()
        run: cat dissertation.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf
          path: dissertation.pdf
          retention-days: 7
          if-no-files-found: error
